name: Actualizar EPG Diario

on:
  schedule:
    # Se ejecuta todos los días a las 04:00 AM UTC (Ajusta según tu zona horaria)
    - cron: '0 4 * * *'
  workflow_dispatch: # Esto te permite ejecutarlo manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código del repositorio virtualmente
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Ejecutar tu script de conversión
    - name: Ejecutar script de conversión
      run: python convertir.py

    # 4. Guardar los cambios y subirlos al repositorio de GitHub
    - name: Hacer Commit y Push del XML generado
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add guia_tv.xml
        git commit -m "Actualización automática de EPG" || exit 0
        git push
