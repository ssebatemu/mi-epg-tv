name: Actualizar EPG Diario

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 04:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ejecutar script de conversión
      run: python convertir.py

    - name: Hacer Commit y Push del XML generado
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add guia_tv.xml
        git commit -m "Actualización automática de EPG" || exit 0
        git push
