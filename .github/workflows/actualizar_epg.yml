name: Actualizar EPG Diario

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    # Añadimos permisos explícitos de escritura directamente en el código
    permissions:
      contents: write

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ejecutar script de conversión
      run: python convertir.py

    - name: Guardar cambios de forma segura
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add guia_tv.xml
        # Evita errores si el archivo no ha cambiado y fuerza la subida
        git commit -m "Actualización automática de EPG" || echo "No hay cambios que subir"
        git push origin main || git push origin master
